:root{color-scheme:dark;--bg:#10111a;--side:#141520;--panel:#191b29;--sub:#222436;--line:#2b2e42;--ink:#f5f3ff;--muted:#aaa9bf;--lime:#dbfa82;--lav:#ad9bf8;--red:#ff9eac;font-family:"Iranian Sans",Tahoma,"Segoe UI",sans-serif;font-size:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}button,a,input,select,textarea{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--lime)}button{color:inherit}svg{width:20px;height:20px;vertical-align:middle;flex:none}h1,h2,h3,p{margin:0}h1{font-size:clamp(1.85rem,3.25vw,3.15rem);letter-spacing:-.055em}h2{font-size:1.15rem}h3{font-size:1rem}p{line-height:1.85}small,.muted{color:var(--muted)}small{font-size:.83rem}[hidden]{display:none!important}

/* Store surfaces and dashboard artwork */
:root {
  --bg:#edf4ff; --side:#f8fbff; --panel:#fff; --sub:#f2f7ff;
  --line:#d5e3f5; --ink:#142e53; --muted:#526b8a;
  --accent:#ff9a47; --accent-edge:#cb5e1b; --blue:#175cc6;
  --blue-soft:#e8f2ff; --orange-soft:#fff0df; --orange-ink:#994313;
  --red:#ac3642; --glow:#d5e7ff; --warm-glow:#ffe7d2; --shadow:#1d4a7812;
  color-scheme:light;
}
body:not(.light) {
  --bg:#0b1730; --side:#111f37; --panel:#142541; --sub:#192e50;
  --line:#2b4568; --ink:#f4f8ff; --muted:#a9bddd;
  --blue:#9cc7ff; --blue-soft:#1d395f; --orange-soft:#452b26; --orange-ink:#ffc094;
  --red:#ffadb5; --glow:#183c71; --warm-glow:#332a3c; --shadow:#030d253d;
  color-scheme:dark;
}
body,body.light {
  background:
    radial-gradient(ellipse 65rem 42rem at 0% -5%,var(--glow),transparent 75%),
    radial-gradient(ellipse 47rem 26rem at 92% 58%,var(--warm-glow),transparent 79%),
    var(--bg);
  background-attachment:fixed;
}
aside,.top,body.light aside,body.light .top {background:var(--side)}
.brand {padding-bottom:27px}
.logo {color:#fff;background:linear-gradient(145deg,#4d9aff,#1855bf);box-shadow:0 3px 0 #154394,0 8px 15px #0e469733}
.nav-caption {font-size:.81rem}
.nav {font-size:.94rem}
.nav:hover,.nav.active,body.light .nav:hover,body.light .nav.active {background:var(--blue-soft);color:var(--blue)}
.nav.active {border-color:var(--line);box-shadow:inset -3px 0 var(--accent)}
.local .dot {background:var(--accent);box-shadow:none}
.top {padding-block:9px}
.avatar {background:var(--blue-soft);color:var(--blue)}
.search-trigger,body.light .search-trigger {background:var(--panel)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible {outline-color:var(--blue)}
.hero :focus-visible {outline-color:#fff}
.hero {
  display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);align-items:center;
  min-height:254px;margin:2px 0 34px;border:1px solid #2968bd;border-radius:22px;
  color:#fff;background:
    radial-gradient(ellipse at 22% 58%,#3686e9a8,transparent 59%),
    linear-gradient(117deg,#174b9e,#123a80 60%,#0a285e);
  box-shadow:0 9px 25px #0c316a2d;
}
.hero::before {
  background:
    repeating-radial-gradient(ellipse at 17% 88%,transparent 0 28px,#c9e4ff1c 29px 30px,transparent 31px 49px);
  mask-image:linear-gradient(90deg,#000 5%,transparent 72%);
}
.hero-copy {
  position:relative;z-index:2;width:auto;min-width:0;
  padding:clamp(23px,4vw,46px);overflow-wrap:anywhere;
}
.hero h1 {font-size:clamp(1.95rem,3.8vw,3.5rem);line-height:1.22}
.hero-copy .date,.hero p {color:#e0eeff}
.hero p {margin:10px 0 17px}
.hero .btn {min-height:44px}
.hero .ghost {color:#fff;background:#0e346880;border-color:#8cb6ee99}
.primary {background:var(--accent);color:#29213b;border-color:#ffb378;box-shadow:0 3px 0 var(--accent-edge)}
.scene {
  position:relative;z-index:0;inset:auto;justify-self:center;width:100%;max-width:400px;height:236px;
  perspective:780px;pointer-events:none;
}
.art {
  position:absolute;inset:0;transform-style:preserve-3d;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .22s ease-out;
}
.plate {
  position:absolute;left:13%;top:29%;width:66%;height:55%;display:grid;place-items:center;
  border-radius:18px;border:1px solid #a0d2ff;
  background:linear-gradient(140deg,#69b4ff,#367ce0 63%,#2054b4);
  box-shadow:0 7px 0 #1754b0,0 13px 0 #123b82,5px 23px 28px #071d59a8;
  transform:rotate(-11deg) rotateY(-12deg) rotateX(12deg);
}
.plate::before {content:"";position:absolute;inset:12%;border-radius:10px;border:1px solid #abd5ff70}
.art-bars {display:flex;align-items:end;justify-content:center;gap:9%;height:61%;width:69%;z-index:1}
.art-bars i {
  display:block;width:21%;height:var(--h);border-radius:4px 4px 1px 1px;
  background:linear-gradient(90deg,#fff,#e4efff 77%,#99bcea 79%);box-shadow:5px 7px 6px #123c8a69;
}
.art-bars i:nth-child(3) {background:linear-gradient(90deg,#ffd3a0,#ffab5e 77%,#d87632 79%)}
.receipt {
  position:absolute;left:59%;top:12%;width:24%;height:55%;padding:4%;
  border-radius:9px 9px 0 0;color:#205eac;background:linear-gradient(140deg,#fff,#dcecff);
  clip-path:polygon(0 0,100% 0,100% 100%,87% 94%,75% 100%,62% 94%,50% 100%,37% 94%,25% 100%,12% 94%,0 100%);
  --receipt-pose:rotate(12deg) translateZ(34px);
  transform:var(--receipt-pose);animation:float-receipt 5s ease-in-out infinite;
}
.receipt svg {width:43%;height:auto}
.receipt i {display:block;height:5%;min-height:2px;margin:10% 0;border-radius:8px;background:#92b1d9}
.receipt i:last-child {width:62%;background:#d77a42}
@keyframes float-receipt {50% {transform:var(--receipt-pose) translateY(-7px)}}
.metrics {gap:12px;margin-bottom:17px}
.metric,.panel {background:var(--panel);box-shadow:0 5px 19px var(--shadow)}
.metric {position:relative;padding:19px 14px 14px;border-radius:14px}
.metric .tile,.metric .tile.blue,.metric .tile.pink {
  width:32px;height:32px;margin-bottom:9px;border-radius:9px;box-shadow:none;background:var(--blue-soft);color:var(--blue);
}
.metric .tile.green {background:var(--orange-soft);color:var(--orange-ink)}
.metric .tile svg {width:17px;height:17px}
.metric .value {font-size:clamp(1.15rem,2.1vw,1.65rem)}
.badge,.badge.green {background:var(--blue-soft);color:var(--blue)}
.badge.warn {background:var(--orange-soft);color:var(--orange-ink)}
.quick,body.light .quick {background:var(--sub);border-color:var(--line);color:var(--ink);box-shadow:none}
.quick:hover,body.light .quick:hover {background:var(--blue-soft)}
.quick svg,.quick:nth-child(3n+1) svg {color:var(--blue)}
.chart {gap:clamp(1px,1.5%,12px);background:repeating-linear-gradient(to top,transparent 0 32px,var(--line) 33px,transparent 34px)}
.chart .bar,.bar-col:nth-child(2n) .bar {background:linear-gradient(to top,#276ccf,#6ab4ff)}
.bar-col:last-child .bar {background:linear-gradient(to top,#d66a2e,#ffb973)}
.notice,#toast {background:var(--blue-soft);color:var(--ink);border-color:var(--line)}
label,body.light label {color:var(--ink)}
input,select,textarea,dialog,body.light input,body.light select,body.light textarea {background:var(--panel)}
.product-placeholder {background:var(--blue-soft);color:var(--blue)}
@media(max-width:850px) {main {overflow:clip}}
@media(max-width:640px) {
  .hero {grid-template-columns:minmax(0,1fr);min-height:0;margin-top:0;margin-bottom:28px}
  .hero-copy {padding:21px 16px 12px}
  .hero p {margin:8px 0 13px}
  .scene {width:100%;max-width:330px;height:143px}
  .plate {top:33%;height:61%;border-radius:13px}
  .receipt {top:13%;height:67%;padding:4%}
  .metrics {gap:9px}
}
@media(prefers-reduced-motion:reduce) {.art {transform:none}}
.invoice-tools {align-items:end}
.invoice-tools input {width:11rem}
.form-notice {margin:14px 0 0}
@media print {
  #printArea .panel {box-shadow:none}
  #printArea.thermal .panel {padding:0;border:0;font-size:10pt}
  #printArea.thermal table,#printArea.thermal th {font-size:8pt;white-space:normal}
  #printArea.thermal td,#printArea.thermal th {padding:3px;overflow-wrap:anywhere}
  #printArea.thermal svg {color:#000}
}
.custom-fields {margin:15px 0 0;padding:10px 12px 12px;min-width:0;border:1px solid var(--line);border-radius:9px}
.custom-fields legend {color:var(--muted);font-size:.9rem;padding:0 6px}
.custom-row {display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}
.custom-row button {min-height:39px}
.record-attachment {margin-top:12px}
.record-attachment img {display:block;max-height:190px;max-width:100%;object-fit:contain;border-radius:9px}
@media(max-width:570px) {
  .custom-row {gap:5px}
}

.currency-field {min-width:0;align-content:start}
.currency-field input,.currency-field .toman-preview {font-variant-numeric:tabular-nums}
.currency-field input:read-only {background:var(--blue-soft)}
.toman-preview {font-size:.76rem;color:var(--muted);min-height:1.15em}
.record-line label {align-self:start}
.record-line .btn {align-self:start;margin-top:25px}
.stock-tiles {display:flex;gap:9px;overflow-x:auto;padding:4px 2px 12px;margin-bottom:10px}
.stock-tile {
  display:grid;place-items:center;align-content:center;gap:8px;flex:0 0 auto;min-width:110px;min-height:74px;
  padding:10px;color:var(--blue);background:var(--panel);border:1px solid var(--line);border-radius:12px;font-size:.83rem;
}
.stock-tile.selected {border-color:var(--blue);background:var(--blue-soft);font-weight:700}
.support-footer {
  display:grid;gap:14px;margin-top:32px;padding:20px;border-radius:15px;
  color:var(--ink);background:var(--panel);border:1px solid var(--line);
}
.support-footer strong {font-size:1.15rem}
.support-footer p {font-size:.86rem;color:var(--muted);margin-top:3px}
.support-links {display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.support-icon {
  display:grid;place-items:center;width:46px;height:46px;border-radius:13px;
  border:1px solid var(--line);transition:transform .18s,box-shadow .18s;
}
.support-icon:hover {transform:translateY(-2px);box-shadow:0 4px 10px var(--shadow)}
.support-icon svg {width:22px;height:22px}
.support-icon--phone {background:var(--orange-soft);color:var(--orange-ink)}
.support-icon--instagram {background:linear-gradient(145deg,#653fc4,#b82773 60%,#e87933);color:#fff}
.support-icon--telegram {background:#1d80b5;color:#fff}
.support-icon--bale {background:#e5f6f0;color:#128968}
details.panel summary {cursor:pointer;font-weight:700;color:var(--blue)}
details.panel p {margin-top:10px}
.search-line {display:flex;align-items:stretch;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.search-line input {flex:1;min-width:155px}
.photo-result {display:flex;align-items:center;gap:10px;margin-top:7px}
.photo-result img {width:55px;height:55px;object-fit:cover;border-radius:8px}
#mobileNav {display:none}
@media(max-width:640px){
  main #content {padding-bottom:calc(95px + env(safe-area-inset-bottom))}
  .top {display:grid;grid-template-columns:1fr;gap:7px}
  .top-actions {display:grid;grid-template-columns:minmax(0,1fr) auto auto}
  .search-trigger {width:100%;justify-content:flex-start;padding-inline:10px;font-size:.82rem}
  .search-trigger kbd {display:none}
  #mobileNav {
    position:fixed;z-index:4;bottom:calc(9px + env(safe-area-inset-bottom));inset-inline:12px;
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;
    padding:5px;border:1px solid var(--line);border-radius:23px;
    background:var(--panel);box-shadow:0 7px 26px #10265031;
  }
  #mobileNav button {
    display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;min-height:48px;
    background:transparent;color:var(--muted);border:0;border-radius:17px;font-size:.72rem;
  }
  #mobileNav .active {background:var(--blue-soft);color:var(--blue);font-weight:700}
  #mobileNav .mobile-sale {background:var(--orange-soft);color:var(--orange-ink);font-weight:700}
 
  #toast {bottom:calc(78px + env(safe-area-inset-bottom))}
}

.invoice-actions {margin-bottom:12px}
.invoice-payment {margin-top:16px}
.invoice-payment small {display:block;margin-top:7px}
.invoice-options {margin-top:16px;padding:10px;border:1px solid var(--line);border-radius:10px}
.invoice-options summary {cursor:pointer;color:var(--blue);font-size:.86rem}
.invoice-options > .fields {margin-top:12px}
.stock-warning {border-color:var(--accent);background:var(--orange-soft)}
.stock-warning ul {padding-inline-start:22px}
.scan-panel {display:grid;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;margin:10px 0}
.scan-preview {overflow:hidden;border-radius:8px;background:#0d1b30}
.scan-preview video {display:block;width:100%;max-height:250px;object-fit:contain}
.scan-status {font-size:.84rem;color:var(--muted)}
.manual-barcode {align-items:end;margin-bottom:12px}
@media(max-width:540px){
  .record-line {grid-template-columns:minmax(0,1fr) minmax(0,1.65fr) auto;align-items:start}
  .record-line > label:first-child {grid-column:1/-1}
}
  </style>
</head>
<body>
  <aside id="sidebar" aria-label="بخش‌های فروشگاه"></aside>
  <main>
    <header class="top">
      <div class="top-title">
        <button class="icon-btn mobile" data-action="menu" aria-label="باز کردن منو" id="mobileMenu"></button>
        <span id="crumb">نمای کلی</span>
      </div>
      <div class="top-actions">
        <button class="search-trigger" data-action="search"><span id="searchIcon"></span> جستجو در فروشگاه من <kbd>Ctrl K</kbd></button>
        <button class="icon-btn" data-view="alerts" id="bell" aria-label="هشدارها"></button>
        <button class="avatar" data-view="settings" aria-label="تنظیمات فروشگاه">ف</button>
      </div>
    </header>
    <div id="content"></div>
  </main>
  <dialog id="dialog"><div id="dialogBody"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="printArea"></div>
  <nav id="mobileNav" aria-label="دسترسی سریع موبایل"></nav>

function bulkPriceForm(){
  const groups=[...new Set(state.products.map(p=>p.group).filter(Boolean))];
  const form=modalForm("تغییر گروهی قیمت فروش",formRows(
    field("گروه کالا","group","",{options:[["","همه گروه‌ها"],...groups.map(group=>[group,group])]}),

    amountField("درصد تغییر","percent",0,{min:.01,step:.01})
  )+'<p id="pricePreview" class="notice form-notice"></p>',data=>{
    const prices=priceUpdates(data);
    if(!prices.size)throw new Error("در این گروه کالایی برای تغییر قیمت وجود ندارد.");
    edit(next=>{
      for(const product of next.products)if(prices.has(product.id))product.price=prices.get(product.id);
    },money(prices.size)+" قیمت فروش به‌روز شد.");
  });
  function preview(){
    const data=new FormData(form);
    try{
      const prices=priceUpdates(data);
      const first=state.products.find(p=>prices.has(p.id));
      $("#pricePreview").textContent=first
        ? money(prices.size)+" کالا · "+first.name+"، از "+cash(first.price)+" به "+cash(prices.get(first.id))
        : "در این گروه کالایی پیدا نشد.";
    }catch(error){$("#pricePreview").textContent=error.message;}
  }
  form.addEventListener("input",preview);

function priceUpdates(form){
  const group=form.get("group");
  const percent=num(form.get("percent"));
  const decreasing=form.get("direction")==="decrease";
  if(decreasing&&percent>100)throw new Error("درصد کاهش نمی‌تواند بیشتر از ۱۰۰ باشد.");
  const factor=1+(decreasing?-percent:percent)/100;
  const prices=new Map();
  for(const product of state.products){
    if(group&&product.group!==group)continue;
    const price=Math.round(product.price*factor*10)/10;
    if(!Number.isSafeInteger(Math.round(price*10))||price>1_000_000_000_000)throw new Error("قیمت جدید از سقف قابل ثبت بیشتر است.");
    prices.set(product.id,price);
  }
  return prices;
}

function reports(){
  const within=d=>(!reportRange.start||d>=reportRange.start)&&(!reportRange.end||d<=reportRange.end);

  const expenses=state.tx.filter(t=>t.kind==="expense"&&within(t.date)).reduce((s,t)=>s+t.amount,0);
  const valuation=state.products.reduce((s,p)=>s+count(p)*unitCost(p),0);
  const totals=[["فروش خالص",netSales(docs)],["خرید خالص",netBuys(docs)],["سود ناخالص فروش",profit(docs)],["سود پس از هزینه‌های ثبت‌شده",profit(docs)-expenses],["هزینه ثبت‌شده",expenses],["ارزش موجودی فعلی",valuation]];
  const productRows=state.products.map(p=>{
    let incoming=0,outgoing=0,sales=0;
    for(const d of docs) for(const l of d.lines.filter(l=>l.product===p.id)){
      if(d.kind==="buy"||d.kind==="saleReturn") incoming+=l.qty;

function imageFile(file,old=""){
  if(!file?.size)return Promise.resolve(old);
  if(!["image/png","image/jpeg","image/webp"].includes(file.type)||file.size>600000) throw new Error("تصویر JPEG، PNG یا WebP با حجم کمتر از ۶۰۰ کیلوبایت انتخاب کنید.");
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(new Error("خواندن فایل ممکن نشد."));
    reader.readAsDataURL(file);
  });
}

function addInvoiceBarcode(value){
  const barcode=normalize(value);
  if(!barcode)throw new Error("بارکد کالا را وارد کنید.");
  const product=state.products.find(p=>p.sku&&normalize(p.sku)===barcode);
  if(!product)throw new Error("کالایی با این بارکد پیدا نشد.");
  const form=$("#modalForm");
  const rows=[...$("#lines").children];
  const same=rows.find(row=>$('[name="product"]',row).value===product.id &&
    inputTomans($('[name="price"]',row).value)=== (["buy","buyReturn"].includes(form.elements.kind.value)?product.cost:product.price));
  if(same){
    const qty=$('[name="qty"]',same);
    qty.value=num(qty.value)+1;
    updateDocTotal();
  }else{
    let empty=rows.find(row=>!$('[name="product"]',row).value);
    if(!empty){
      $("#lines").insertAdjacentHTML("beforeend",lineFields());
      empty=$("#lines").lastElementChild;
    }
    const select=$('[name="product"]',empty);
    select.value=product.id;
    select.dispatchEvent(new Event("input",{bubbles:true}));
  }
  clearStockWarning(form);
  $(".error",form).textContent="";
}
function clearStockWarning(form=$("#modalForm")){
  const warning=form&&$("#stockWarning",form);
  if(warning){warning.hidden=true;warning.replaceChildren();}
}
function docStockShortages(record,exclude,old){
  const signs={sale:-1,buy:1,saleReturn:1,buyReturn:-1};
  const delta=(doc,product,warehouse)=>doc?.status==="posted"&&doc.warehouse===warehouse?
    (signs[doc.kind]??0)*doc.lines.filter(line=>line.product===product).reduce((sum,line)=>sum+line.qty,0):0;
  const warehouses=new Set([record.warehouse,old?.warehouse].filter(Boolean));
  const shortages=[];
  for(const product of new Set([...record.lines,...(old?.lines??[])].map(line=>line.product))){
    const item=get("products",product);
    if(!item||item.service)continue;
    for(const warehouse of warehouses){
      const base=stock(item,warehouse,exclude);
      const before=base+delta(old,product,warehouse);
      const after=Math.round((base+delta(record,product,warehouse))*1000)/1000;
      if(after<0&&after<before-.000001)shortages.push({product,warehouse,name:item.name,after});
    }
  }
  return shortages;
}
function updateDocTotal(){

  const net=Math.max(0,Math.round((sum-inputTomans(form.elements.discount.value))*10)/10);
  const preview=form.elements.kind.value==="quote";
  const method=form.elements.paymentMode.value;
  form.elements.paymentMode.disabled=preview;
  form.elements.paid.readOnly=preview||method!=="partial";
  form.elements.paid.closest("label").hidden=preview||method!=="partial";
  if(form.elements.paid.readOnly)refreshCurrency(form.elements.paid,!preview&&method==="full"?net:0);
  const remaining=Math.max(0,Math.round((net-inputTomans(form.elements.paid.value))*10)/10);
  $("#paymentHelp").textContent=!preview&&remaining>0?"مانده حساب: "+cash(remaining):"";
  $("#docTotal").textContent="مبلغ نهایی: "+cash(net);
}

function download(filename,data,type){
  const url=URL.createObjectURL((data instanceof Blob?data:new Blob([data],{type})));
  const a=document.createElement("a");a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();

}
function pdfBlob(pages,width,height){
  const encoder=new TextEncoder();
  const chunks=[];
  const offsets=[0];
  let length=0;
  function write(value){
    const bytes=typeof value==="string"?encoder.encode(value):value;
    chunks.push(bytes);
    length+=bytes.length;
  }
  function object(index,contents){
    offsets[index]=length;
    write(index+" 0 obj\n");
    for(const part of contents)write(part);
    write("\nendobj\n");
  }
  const ref=i=>i+" 0 R";
  write("%PDF-1.4\n");
  object(1,["<< /Type /Catalog /Pages 2 0 R >>"]);
  object(2,["<< /Type /Pages /Count "+pages.length+" /Kids ["+pages.map((_,i)=>ref(3+i*3)).join(" ")+"] >>"]);
  pages.forEach((page,i)=>{
    const number=3+i*3;
    const image=Uint8Array.from(atob(page.jpeg.split(",")[1]),character=>character.charCodeAt(0));
    const paint="q "+width+" 0 0 "+height+" 0 0 cm /PageImage Do Q\n";
    object(number,["<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+width+" "+height+"] /Resources << /XObject << /PageImage "+ref(number+1)+" >> >> /Contents "+ref(number+2)+" >>"]);
    object(number+1,["<< /Type /XObject /Subtype /Image /Width "+page.width+" /Height "+page.height+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+image.length+" >>\nstream\n",image,"\nendstream"]);
    object(number+2,["<< /Length "+paint.length+" >>\nstream\n"+paint+"endstream"]);
  });
  const xref=length;
  write("xref\n0 "+offsets.length+"\n0000000000 65535 f \n");
  for(const position of offsets.slice(1))write(String(position).padStart(10,"0")+" 00000 n \n");
  write("trailer\n<< /Size "+offsets.length+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF\n");
  return new Blob(chunks,{type:"application/pdf"});
}
function splitPdfLine(ctx,text,maxWidth){
  const result=[];
  for(const paragraph of text.split(/\n/)){
    let line="";
    for(const word of paragraph.trim().split(/\s+/)){
      const next=line?line+" "+word:word;
      if(line&&ctx.measureText(next).width>maxWidth){result.push(line);line="";}
      if(ctx.measureText(word).width>maxWidth){
        for(const char of word){
          if(line&&ctx.measureText(line+char).width>maxWidth){result.push(line);line="";}
          line+=char;
        }
      }else line=line?line+" "+word:word;
    }
    result.push(line);
  }
  return result;
}
function downloadPdf(filename,html,paper="A4"){
  const sizes={A4:[595,842],A5:[420,595],"80mm":[227,570],"58mm":[164,500]};
  const [width,height]=sizes[paper]??sizes.A4;
  const margin=width<300?13:32;
  const contentWidth=width-2*margin;
  const source=document.createElement("template");
  source.innerHTML=html;
  const blocks=[...source.content.querySelectorAll("h1,h2,h3,p,table,.total")];
  const pages=[];
  const canvas=document.createElement("canvas");
  canvas.width=width*2;
  canvas.height=height*2;
  const ctx=canvas.getContext("2d");
  ctx.scale(2,2);
  ctx.direction="rtl";
  ctx.textAlign="right";
  ctx.textBaseline="top";
  let y;
  function begin(){
    ctx.fillStyle="#fff";
    ctx.fillRect(0,0,width,height);
    y=margin;
  }
  function finish(){
    pages.push({jpeg:canvas.toDataURL("image/jpeg",.93),width:canvas.width,height:canvas.height});
  }
  function reserve(size){
    if(y+size<=height-margin)return;
    finish();
    begin();
  }
  function row(values,{font=12,bold=false,header=false}={}){
    const columns=values.length;
    const spacing=columns>1?5:0;
    const column=(contentWidth-(columns-1)*spacing)/columns;
    const step=Math.ceil(font*1.65);
    ctx.font=(bold?"bold ":"")+font+"px \"Iranian Sans\", Tahoma, Arial, sans-serif";
    const lines=values.map(value=>splitPdfLine(ctx,value,column-6));
    const rows=Math.max(...lines.map(list=>list.length));
    for(let i=0;i<rows;i++){
      reserve(step);
      if(header){ctx.fillStyle="#eaf2fc";ctx.fillRect(margin,y,contentWidth,step);}
      ctx.fillStyle=bold?"#123f80":"#152e50";
      lines.forEach((list,j)=>ctx.fillText(list[i]??"",width-margin-j*(column+spacing)-3,y+2));
      y+=step;
    }
    if(columns>1){
      ctx.fillStyle="#d7e1ee";
      ctx.fillRect(margin,y-1,contentWidth,.4);
    }
    y+=3;
  }
  begin();
  for(const block of blocks){
    if(block.tagName==="TABLE"){
      for(const tr of block.querySelectorAll("tr")){
        const header=Boolean(tr.querySelector("th"));
        row([...tr.cells].map(cell=>cell.textContent.trim()),{font:width<300?8:11,bold:header,header});
      }
      y+=9;
    }else if(block.textContent.trim()){
      const bold=/^H[123]$/.test(block.tagName)||block.classList.contains("total");
      const value=block.classList.contains("total")?[...block.children].map(node=>node.textContent.trim()).join(" · "):block.textContent.trim();
      row([value],{font:width<300?(bold?11:9):(bold?16:12),bold});
    }
  }
  finish();
  download(filename,pdfBlob(pages,width,height),"application/pdf");
}

function isValidBackup(d){
  const finite=n=>typeof n==="number"&&Number.isFinite(n);
  const textValue=s=>typeof s==="string";
  const isDate=s=>typeof s==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&Number.isFinite(+new Date(s+"T12:00:00"));
  const inList=(key,list)=>list.includes(key);
  if(d?.version!==1||!d.settings||!textValue(d.settings.name)||!inList(d.settings.theme,["dark","light"]))return false;
  for(const key of ["products","people","docs","tx","checks","shipments","moves","warehouses","cashboxes"]){
    const list=d[key];
    if(!Array.isArray(list)||!list.every(r=>r&&textValue(r.id))||new Set(list.map(r=>r.id)).size!==list.length)return false;
    if(!list.every(r=>r.customFields===undefined || Array.isArray(r.customFields)&&r.customFields.every(f=>f&&textValue(f.name)&&textValue(f.value))))return false;
  }
  const has=(list,k)=>d[list].some(x=>x.id===k);
  return d.cashboxes.length&&d.warehouses.length&&
    d.cashboxes.every(x=>textValue(x.name)&&finite(x.opening))&&d.warehouses.every(x=>textValue(x.name))&&
    d.products.every(x=>textValue(x.name)&&finite(x.price)&&x.price>=0&&finite(x.cost)&&finite(x.opening)&&finite(x.min)&&has("warehouses",x.warehouse))&&
    d.people.every(x=>textValue(x.name)&&inList(x.type,Object.keys(personTypes)))&&
    d.docs.every(x=>Number.isSafeInteger(x.no)&&isDate(x.date)&&finite(x.discount)&&finite(x.paid)&&inList(x.kind,Object.keys(labels).slice(0,5))&&inList(x.status,["posted","draft"])&&has("warehouses",x.warehouse)&&has("cashboxes",x.box)&&Array.isArray(x.lines)&&x.lines.length&&x.lines.every(l=>l&&has("products",l.product)&&finite(l.qty)&&l.qty>0&&finite(l.price)&&finite(l.cost)))&&
    d.tx.every(x=>isDate(x.date)&&finite(x.amount)&&inList(x.kind,Object.keys(labels).slice(5))&&has("cashboxes",x.box))&&
    d.checks.every(x=>isDate(x.due)&&finite(x.amount)&&inList(x.kind,["received","paid"])&&has("cashboxes",x.box))&&
    d.shipments.every(x=>textValue(x.recipient)&&has("docs",x.doc))&&
    d.moves.every(x=>isDate(x.date)&&finite(x.qty)&&x.qty>0&&has("products",x.product)&&(!x.from||has("warehouses",x.from))&&(!x.to||has("warehouses",x.to)));
}
async function restore(file){
  if(!file)return;
  if(file.size>6500000)throw new Error("حجم فایل پشتیبان بیش از ظرفیت این نسخه است.");
  const d=JSON.parse(await file.text());

}

const code39=Object.fromEntries([...("0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-. $/+%*")].map((c,i)=>[c,[
  0x034,0x121,0x061,0x160,0x031,0x130,0x070,0x025,0x124,0x064,0x109,0x049,0x148,0x019,0x118,0x058,0x00d,0x10c,0x04c,0x01c,0x103,0x043,0x142,0x013,0x112,0x052,0x007,0x106,0x046,0x016,0x181,0x0c1,0x1c0,0x091,0x190,0x0d0,0x085,0x184,0x0c4,0x0a8,0x0a2,0x08a,0x02a,0x094
][i]]));
function drawBarcode(sku){
  let x=10;
  let bars="";
  for(const c of "*"+sku+"*"){
    const bits=code39[c];
    for(let n=0;n<9;n++){
      const w=(bits&(1<<(8-n)))?3:1;
      if(n%2===0)bars+='<rect x="'+x+'" y="0" width="'+w+'" height="44"/>';
      x+=w;
    }
    x++;
  }
  return '<svg role="img" aria-label="بارکد کالا" style="height:54px;width:min(100%,340px);background:white;display:block" viewBox="0 0 '+(x+10)+' 44" fill="#111">'+bars+"</svg>";
}

const barcodeFormats=["ean_13","ean_8","upc_a","upc_e","code_128","code_39","code_93","itf","codabar","qr_code","data_matrix"];
let scanSession=null;
function endScan(){
  const session=scanSession;
  scanSession=null;
  if(!session)return;
  clearTimeout(session.timer);
  session.stream?.getTracks().forEach(track=>track.stop());
  session.panel.remove();
}
function createBarcodeReader(){
  const {MultiFormatReader,DecodeHintType,BarcodeFormat}=ZXing;
  const reader=new MultiFormatReader();
  reader.setHints(new Map([
    [DecodeHintType.POSSIBLE_FORMATS,barcodeFormats.map(format=>BarcodeFormat[format.toUpperCase()])],
    [DecodeHintType.TRY_HARDER,true]
  ]));
  return reader;
}
function decodeBarcodePixels(reader,rgba,width,height,rotation){
  const sideways=rotation%180!==0;
  const rotatedWidth=sideways?height:width;
  const rotatedHeight=sideways?width:height;
  const luminance=new Uint8ClampedArray(width*height);
  for(let y=0;y<height;y++){
    for(let x=0;x<width;x++){
      const source=(y*width+x)*4;
      const dest=rotation===90?x*height+(height-1-y):y*width+x;
      luminance[dest]=(rgba[source]+2*rgba[source+1]+rgba[source+2])>>2;
    }
  }
  const {BinaryBitmap,HybridBinarizer,RGBLuminanceSource}=ZXing;
  const image=new BinaryBitmap(new HybridBinarizer(new RGBLuminanceSource(luminance,rotatedWidth,rotatedHeight)));
  try{return reader.decodeWithState(image).getText();}
  catch{return "";}
}
async function scan(mode){

  const form=$("#modalForm");
  if(!form)return;
  const panel=document.createElement("section");

    button("وارد کردن دستی",{action:"scan-manual"})+
    '</div><div class="scan-preview"><video playsinline autoplay muted></video></div>'+
    '<p aria-live="polite" class="scan-status">در حال راه‌اندازی دوربین…</p>';
  if(mode==="invoice")$(".invoice-actions",form).after(panel);
  else form.prepend(panel);
  const session={panel,form,mode,stream:null,timer:null};
  scanSession=session;
  panel.scrollIntoView({block:"nearest"});
  const active=()=>scanSession===session&&panel.isConnected;
  const message=$(".scan-status",panel);
  if(!navigator.mediaDevices?.getUserMedia){
    message.textContent="دوربین در این مرورگر یا نشانی در دسترس نیست. بارکد را دستی وارد کنید.";
    return;
  }
  const video=$("video",panel);
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}
    });
    if(!active()){stream.getTracks().forEach(track=>track.stop());return;}
    session.stream=stream;
    video.srcObject=stream;
    await video.play();
    if(!active())return;
  }catch{
    if(active()){
      session.stream?.getTracks().forEach(track=>track.stop());
      session.stream=null;
      message.textContent="دسترسی به دوربین ممکن نشد. می‌توانید بارکد را دستی وارد کنید.";
    }
    return;
  }
  const track=session.stream.getVideoTracks()[0];
  try{
    if(track?.getCapabilities?.().focusMode?.includes("continuous")){
      track.applyConstraints({advanced:[{focusMode:"continuous"}]}).catch(()=>{});
    }
  }catch{}
  let nativeReader=null;
  try{
    const supported=await window.BarcodeDetector?.getSupportedFormats?.();
    if(!active())return;
    const formats=barcodeFormats.filter(format=>supported?.includes(format));
    if(formats.length)nativeReader=new BarcodeDetector({formats});
  }catch{}
  if(!active())return;
  const reader=createBarcodeReader();
  const canvas=document.createElement("canvas");
  const ctx=canvas.getContext("2d",{willReadFrequently:true});
  const tilted=document.createElement("canvas");
  const tiltCtx=tilted.getContext("2d",{willReadFrequently:true});
  let frame=0, fallbackFrame=0;
  let lastTime=-1;
  const found=value=>{
    endScan();
    if(mode==="invoice"){
      try{addInvoiceBarcode(value);toast("کالا با بارکد به فاکتور اضافه شد.");}
      catch(error){notifyError(error);}
    }else{
      form.elements.sku.value=value;
      form.elements.sku.dispatchEvent(new Event("input",{bubbles:true}));
    }
  };
  message.textContent="بارکد را واضح روبه‌روی دوربین بگیرید. جهت گوشی فرقی ندارد.";
  const tick=async()=>{
    if(!active())return;
    try{
      if(video.videoWidth&&video.currentTime!==lastTime){
        lastTime=video.currentTime;
        frame++;
        if(nativeReader){
          try{
            const codes=await nativeReader.detect(video);
            if(!active())return;
            if(codes[0]?.rawValue){found(codes[0].rawValue);return;}
          }catch{nativeReader=null;}
        }
        if(!nativeReader||frame%3===0){
          const scale=Math.min(1,960/Math.max(video.videoWidth,video.videoHeight));
          const width=Math.round(video.videoWidth*scale);
          const height=Math.round(video.videoHeight*scale);
          if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;}
          ctx.drawImage(video,0,0,width,height);
          const rgba=ctx.getImageData(0,0,width,height).data;
          const value=decodeBarcodePixels(reader,rgba,width,height,0)||decodeBarcodePixels(reader,rgba,width,height,90);
          if(value){found(value);return;}
          // Alternate diagonal passes after the faster checks.
          const diagonal=Math.ceil(Math.hypot(width,height));
          if(tilted.width!==diagonal||tilted.height!==diagonal){tilted.width=diagonal;tilted.height=diagonal;}
          tiltCtx.setTransform(1,0,0,1,0,0);
          tiltCtx.fillStyle="#fff";
          tiltCtx.fillRect(0,0,diagonal,diagonal);
          tiltCtx.translate(diagonal/2,diagonal/2);
          tiltCtx.rotate((fallbackFrame++%2===0?1:-1)*Math.PI/4);
          tiltCtx.drawImage(canvas,-width/2,-height/2);
          const angled=tiltCtx.getImageData(0,0,diagonal,diagonal).data;
          const diagonalValue=decodeBarcodePixels(reader,angled,diagonal,diagonal,0);
          if(diagonalValue){found(diagonalValue);return;}
        }
      }
    }catch{
      if(active()){
        session.stream?.getTracks().forEach(track=>track.stop());
        session.stream=null;
        message.textContent="خواندن تصویر دوربین ممکن نشد. بارکد را دستی وارد کنید.";
      }
      return;
    }
    session.timer=setTimeout(tick,75);
  };
  tick();
}

async function imageSignature(source){
  const img=new Image();
  img.src=source;
  await img.decode();
  const canvas=document.createElement("canvas");
  canvas.width=canvas.height=20;
  const ctx=canvas.getContext("2d",{willReadFrequently:true});
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,20,20);
  ctx.drawImage(img,0,0,20,20);
  const rgba=ctx.getImageData(0,0,20,20).data;
  const pixels=[];
  const histogram=Array(24).fill(0);
  for(let i=0;i<rgba.length;i+=4){
    const r=rgba[i],g=rgba[i+1],b=rgba[i+2];
    histogram[Math.floor(r/32)]++;
    histogram[8+Math.floor(g/32)]++;
    histogram[16+Math.floor(b/32)]++;
    pixels.push((r+g+b)/3);
  }
  const average=pixels.reduce((sum,v)=>sum+v,0)/pixels.length;
  return {histogram,bits:pixels.map(value=>value>=average)};
}
function imageDistance(a,b){
  return a.histogram.reduce((sum,value,i)=>sum+Math.abs(value-b.histogram[i]),0)/2400*.45+
    a.bits.reduce((sum,bit,i)=>sum+(bit===b.bits[i]?0:1),0)/a.bits.length*.55;
}
async function searchByPhoto(file){
  const result=$("#searchResults");
  if(!file||!result)return;
  const request=++photoSearch;
  const products=state.products.filter(p=>/^data:image\/(png|jpeg|webp);base64,/i.test(p.image??""));
  if(!products.length){result.textContent="برای جست‌وجوی تصویری، ابتدا برای کالاها عکس ثبت کن.";return;}
  if(file.size>12000000){result.textContent="عکسی کوچک‌تر از ۱۲ مگابایت انتخاب کن.";return;}
  result.textContent="در حال مقایسهٔ عکس‌ها…";
  const url=URL.createObjectURL(file);
  try{
    const source=await imageSignature(url);
    const matches=[];
    for(const product of products){
      if(!result.isConnected||request!==photoSearch)return;
      try{matches.push({product,score:imageDistance(source,await imageSignature(product.image))});}catch{}
    }
    if(result.isConnected&&request===photoSearch){
      matches.sort((a,b)=>a.score-b.score);
      result.innerHTML=matches.length?'<p class="muted">نزدیک‌ترین عکس‌ها در انبار</p>'+matches.slice(0,6).map(({product})=>'<div class="photo-result">'+productImage(product)+button(product.name,{action:"product",id:product.id})+'</div>').join(""):"نتیجه‌ای پیدا نشد.";
    }
  }catch{if(result.isConnected&&request===photoSearch)result.textContent="خواندن این عکس ممکن نشد.";}
  finally{URL.revokeObjectURL(url);}
}

document.addEventListener("input",event=>{
  const input=event.target;
  if(!input.matches("[data-currency]"))return;
  const raw=rialDigits(input.value);
  if(!/^-?[0-9]*$/.test(raw)||Math.abs(Number(raw))>10_000_000_000_000){
    input.nextElementSibling.textContent="مبلغ ریالی معتبر وارد کنید.";
    return;
  }
  const remaining=rialDigits(input.value.slice(input.selectionStart)).length;
  if(raw&&raw!=="-"){
    refreshCurrency(input,Number(raw)/10);
    let cursor=input.value.length;
    let count=0;
    while(cursor>0&&count<remaining){
      if(/[۰-۹]/.test(input.value[--cursor]))count++;
    }
    input.setSelectionRange(cursor,cursor);
  }else input.nextElementSibling.textContent="۰ تومان";
},true);
