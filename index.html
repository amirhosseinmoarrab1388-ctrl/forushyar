/* Dark graphite surfaces with mint accents and layered dashboard artwork. */
:root {
  --bg:#0a1113; --side:#0d1719; --panel:#111e20; --sub:#18282b;
  --line:#27393b; --ink:#eef8f4; --muted:#a5b9b8;
  --lime:#bafcaa; --lav:#75dfd2; --red:#ffb2bb;
}
body {background:radial-gradient(ellipse at 15% 0%, #13302d 0, transparent 40rem),var(--bg)}
aside {padding-top:34px; background:linear-gradient(170deg,#122323,var(--side) 260px)}
.brand {padding-bottom:28px}
.logo {color:#102b24; background:linear-gradient(140deg,#e2ffbd,#77e7b9); box-shadow:0 4px 0 #386950,0 12px 22px #020b08bb}
.nav:hover,.nav.active {background:#193131}
.nav.active {border-color:#2d4943;box-shadow:inset -3px 0 #a0efae}
.nav-caption {font-size:.81rem}
.nav {font-size:.94rem}
.top {background:#0b1516bb;padding-block:10px}
.avatar {background:#1e3636;color:#a4f2d8}
.search-trigger {background:#122021}
.hero {
  min-height:295px; margin-top:17px; margin-bottom:46px; border-radius:24px;
  border:1px solid #40675a;
  background:radial-gradient(ellipse at 24% 60%,#1c5750,transparent 52%),linear-gradient(115deg,#143836,#142927 65%,#132423);
  box-shadow:0 7px 0 #101d1e,0 20px 40px #0005;
}
.hero::before {
  background-image:linear-gradient(#75e8c320 1px,transparent 1px),linear-gradient(90deg,#75e8c320 1px,transparent 1px);
  mask-image:linear-gradient(90deg,#000 5%,transparent 77%);
  background-size:30px 30px;
}
.hero-copy {padding:36px clamp(22px,4vw,54px)}
.hero h1 {color:#f3fff8;font-size:clamp(2rem,4vw,4rem);line-height:1.18}
.hero-copy .date,.hero p {color:#bbe0d6}
.hero .ghost {color:#f1fff9;background:#102e2bcc;border-color:#52736a}
.primary {background:#bafcaa;color:#142b21;border-color:#daffd0;box-shadow:0 3px 0 #5a946b}
.scene {top:-14%;left:3%;width:47%;height:130%;perspective:750px}
.orbit {left:5%;top:30%;width:89%;height:55%;border-color:#6fe2c866;box-shadow:0 0 34px #37ffc223;transform:rotate(-22deg) translateZ(-25px)}
.orbit.two {border-color:#83ddc338;transform:rotate(20deg) translateZ(-32px)}
.plate {
  left:16%;top:24%;width:65%;height:57%;border:1px solid #9be9d2;
  background:linear-gradient(145deg,#5fbba9,#2f7c71 65%,#1e6058);
  box-shadow:0 9px 0 #14594d,0 18px 0 #123d38,8px 33px 42px #001e1cc9;
  transform:rotate(-14deg) rotateY(-16deg) rotateX(16deg) translateZ(10px);
}
.plate::before {border-color:#a3f2d36b;background:repeating-linear-gradient(to top,transparent 0 25px,#9ee7d244 26px,transparent 27px)}
.art-bars i {background:linear-gradient(90deg,#a2e7a1,#e4ffd0 78%,#64be8c 80%);box-shadow:6px 7px 6px #05252685}
.art-bars i:nth-child(2) {background:linear-gradient(90deg,#9ce5d8,#d4fff3 78%,#59b9a7 80%)}
.receipt {
  top:4%;left:59%;width:27%;height:51%;padding:5%;color:#235a50;
  background:linear-gradient(140deg,#f6fff5,#c3eedf);--pose:rotate(15deg) translateZ(66px);
  filter:drop-shadow(0 14px 18px #062b26aa);
}
.receipt i {background:#7ebaaa}
.receipt i:last-child {background:#4e9f8b}
.coin {
  left:9%;top:61%;width:24%;color:#225440;
  background:linear-gradient(135deg,#f0ffbc,#9df3b1 62%,#53ac7a);
  border-color:#cdffbd;--pose:rotate(-19deg) translateZ(79px);
  box-shadow:0 8px 0 #58946a,0 13px 0 #335e4c,9px 23px 24px #091d16b0;
}
.coin::before {border-color:#4f9771}
.stock-icon {
  position:absolute;display:grid;place-items:center;top:67%;left:78%;width:15%;aspect-ratio:1;
  border:1px solid #a2fdea;border-radius:23%;color:#173f3c;
  background:linear-gradient(135deg,#c6fff4,#69d1c5);
  box-shadow:0 6px 0 #306e68,0 11px 0 #194d4d,8px 19px 20px #031e1bb0;
  --pose:rotate(15deg) translateZ(48px);animation-delay:-1s;
}
.stock-icon svg {width:55%;height:55%}
.floating {transform:var(--pose);animation:float-art 5s ease-in-out infinite}
.coin {animation-delay:-2.4s}
.spark {color:#b5fabc;text-shadow:0 0 15px #8affb4bb}
.spark.b {top:57%;left:86%;color:#90f8e4}
@keyframes float-art {50% {transform:var(--pose) translateY(-9px)}}

const crcValues = Array.from({length:256}, (_, value) => {

function zipEntries(files){
  const local=[],central=[];

  for(const [path,source] of files){
    const filename=workbookEncoder.encode(path);
    const data=workbookEncoder.encode(source);
    const crc=crc32(data);
    const header=new Uint8Array(30), entry=new Uint8Array(46);
    const a=new DataView(header.buffer), b=new DataView(entry.buffer);
    a.setUint32(0,0x04034b50,true);
    a.setUint16(4,20,true);a.setUint16(12,33,true);a.setUint32(14,crc,true);
    a.setUint32(18,data.length,true);a.setUint32(22,data.length,true);a.setUint16(26,filename.length,true);
    b.setUint32(0,0x02014b50,true);
    b.setUint16(4,20,true);b.setUint16(6,20,true);b.setUint16(14,33,true);b.setUint32(16,crc,true);
    b.setUint32(20,data.length,true);b.setUint32(24,data.length,true);b.setUint16(28,filename.length,true);b.setUint32(42,offset,true);

    offset+=header.length+filename.length+data.length;
    centralSize+=entry.length+filename.length;
  }

  view.setUint32(0,0x06054b50,true);
  view.setUint16(8,files.length,true);view.setUint16(10,files.length,true);
  view.setUint32(12,centralSize,true);view.setUint32(16,offset,true);
  return new Blob([...local,...central,end]);
}
function makeWorkbook(sheets){
  const xml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const sheetNs="http://schemas.openxmlformats.org/spreadsheetml/2006/main";
  const office="http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  const pkg="http://schemas.openxmlformats.org/package/2006";
  const types="application/vnd.openxmlformats-officedocument.spreadsheetml.";
  const escapeXml=s=>String(s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,"")
    .replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c]));
  const files=[
    ["[Content_Types].xml",xml+'<Types xmlns="'+pkg+'/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="'+types+'sheet.main+xml"/>'+sheets.map((_,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="'+types+'worksheet+xml"/>').join("")+'</Types>'],
    ["_rels/.rels",xml+'<Relationships xmlns="'+pkg+'/relationships"><Relationship Id="rId1" Type="'+office+'/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ["xl/_rels/workbook.xml.rels",xml+'<Relationships xmlns="'+pkg+'/relationships">'+sheets.map((_,i)=>'<Relationship Id="rId'+(i+1)+'" Type="'+office+'/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join("")+'</Relationships>'],
    ["xl/workbook.xml",xml+'<workbook xmlns="'+sheetNs+'" xmlns:r="'+office+'"><sheets>'+sheets.map(([name],i)=>'<sheet name="'+escapeXml(name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join("")+'</sheets></workbook>']
  ];
  for(const [i,[,rows]] of sheets.entries()){
    const cells=rows.map(row=>"<row>"+row.map(c=>typeof c==="number"?"<c><v>"+c+"</v></c>":'<c t="inlineStr"><is><t xml:space="preserve">'+escapeXml(c)+'</t></is></c>').join("")+"</row>").join("");

  }
  return zipEntries(files);
}

function bulkPriceForm(){
  const groups=[...new Set(state.products.map(p=>p.group).filter(Boolean))];
  const form=modalForm("تغییر گروهی قیمت فروش",formRows(
    field("گروه کالا","group","",{options:[["","همه گروه‌ها"],...groups.map(group=>[group,group])]}),

  )+'<p id="pricePreview" class="notice form-notice"></p>',data=>{
    const prices=priceUpdates(data);
    if(!prices.size)throw new Error("در این گروه کالایی برای تغییر قیمت وجود ندارد.");
    edit(next=>{
      for(const product of next.products)if(prices.has(product.id))product.price=prices.get(product.id);
    },money(prices.size)+" قیمت فروش به‌روز شد.");
  });
  function preview(){
    const data=new FormData(form);
    try{
      const prices=priceUpdates(data);
      const first=state.products.find(p=>prices.has(p.id));
      $("#pricePreview").textContent=first
        ? money(prices.size)+" کالا · "+first.name+"، از "+cash(first.price)+" به "+cash(prices.get(first.id))
        : "در این گروه کالایی پیدا نشد.";

function priceUpdates(form){
  const group=form.get("group");
  const percent=num(form.get("percent"));
  const decreasing=form.get("direction")==="decrease";
  if(decreasing&&percent>100)throw new Error("درصد کاهش نمی‌تواند بیشتر از ۱۰۰ باشد.");
  const factor=1+(decreasing?-percent:percent)/100;
  const prices=new Map();
  for(const product of state.products){
    if(group&&product.group!==group)continue;
    const price=Math.round(product.price*factor);
    if(!Number.isSafeInteger(price)||price>1_000_000_000_000)throw new Error("قیمت جدید از سقف قابل ثبت بیشتر است.");
    prices.set(product.id,price);
  }
  return prices;
}

  const expenses=state.tx.filter(t=>t.kind==="expense"&&within(t.date)).reduce((s,t)=>s+t.amount,0);
  const valuation=state.products.reduce((s,p)=>s+count(p)*unitCost(p),0);
  const totals=[["فروش خالص",netSales(docs)],["خرید خالص",netBuys(docs)],["سود ناخالص فروش",profit(docs)],["سود پس از هزینه‌های ثبت‌شده",profit(docs)-expenses],["هزینه ثبت‌شده",expenses],["ارزش موجودی فعلی",valuation]];

function requiredText(v){
  if(!String(v??"").trim())throw new Error("فیلدهای الزامی را تکمیل کنید.");

function imageFile(file,old=""){
  if(!file?.size)return Promise.resolve(old);
  if(!["image/png","image/jpeg","image/webp"].includes(file.type)||file.size>600000) throw new Error("تصویر JPEG، PNG یا WebP با حجم کمتر از ۶۰۰ کیلوبایت انتخاب کنید.");
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(new Error("خواندن فایل ممکن نشد."));
    reader.readAsDataURL(file);
  });
}

function docForm(current,kind,copy=false){
  if(!state.products.length){modal("ثبت سند",'<p>برای اضافه کردن ردیف فاکتور، ابتدا کالا یا خدمت ثبت کنید.</p><div class="dialog-foot">'+button("ثبت کالا یا خدمت",{action:"product",cls:"btn primary"})+"</div>");return;}

  )+'<div id="lines">'+(d.lines??[{}]).map(lineFields).join("")+'</div><div class="invoice-tools row">'+button("افزودن ردیف",{action:"line-add",symbol:"plus"})+
    field("بارکد کالا","barcode","",{dir:true,placeholder:"اسکن یا وارد کنید"})+button("افزودن بارکد",{action:"invoice-barcode"})+button("دوربین",{action:"scan",value:"invoice",symbol:"scan"})+'</div><div style="height:13px"></div>'+formRows(
    amountField("تخفیف کل (تومان)","discount",d.discount??0),amountField("مبلغ تسویه در فاکتور","paid",d.paid??0),field("توضیحات","note",d.note,{type:"textarea",wide:true}),

  )+customFields(d)+'<p class="notice form-notice" id="docTotal"></p>',async data=>{

      const p=get("products",product);

      const qty=num(data.getAll("qty")[i]),price=num(data.getAll("price")[i]);

      const cost=old?.product===product&&d.kind===v.kind&&d.date===v.date?old.cost:unitCost(p,v.date,d.id);

      return {product,qty,price,cost};
    });
    if(!lines.length)throw new Error("حداقل یک ردیف لازم است.");

function addInvoiceBarcode(value){
  const barcode=normalize(value);
  if(!barcode)throw new Error("بارکد کالا را وارد کنید.");
  const product=state.products.find(p=>p.sku&&normalize(p.sku)===barcode);
  if(!product)throw new Error("کالایی با این بارکد پیدا نشد.");
  const form=$("#modalForm");
  const rows=[...$("#lines").children];
  const same=rows.find(row=>$('[name="product"]',row).value===product.id &&
    num($('[name="price"]',row).value)=== (["buy","buyReturn"].includes(form.elements.kind.value)?product.cost:product.price));
  if(same){
    const qty=$('[name="qty"]',same);
    qty.value=num(qty.value)+1;
    updateDocTotal();
  }else{
    let empty=rows.find(row=>!$('[name="product"]',row).value);
    if(!empty){
      $("#lines").insertAdjacentHTML("beforeend",lineFields());
      empty=$("#lines").lastElementChild;
    }
    const select=$('[name="product"]',empty);
    select.value=product.id;
    select.dispatchEvent(new Event("input",{bubbles:true}));
  }
  form.elements.barcode.value="";
  form.elements.barcode.focus();
  $(".error",form).textContent="";
}
function validateDocStock(record,exclude,old){
  const signs={sale:-1,buy:1,saleReturn:1,buyReturn:-1};
  const delta=d=>d?.status==="posted"?(signs[d.kind]??0):0;
  const warehouses=new Set([record.warehouse,old?.warehouse].filter(Boolean));
  for(const product of new Set([...record.lines,...(old?.lines??[])].map(l=>l.product))){
    const p=get("products",product);
    if(!p||p.service)continue;
    for(const w of warehouses){
      const quantity=record.warehouse===w?record.lines.filter(l=>l.product===product).reduce((a,l)=>a+l.qty,0):0;
      if(stock(p,w,exclude)+delta(record)*quantity<-.000001)throw new Error("موجودی «"+p.name+"» در "+name("warehouses",w)+" کافی نیست.");
    }
  }
}

function download(filename,data,type){
  const url=URL.createObjectURL(new Blob([data],{type}));

}
function excelReport(){
  const sections=[...$("#reportData").querySelectorAll(".panel")].map(panel=>[
    [panel.querySelector("h2").textContent],...[...panel.querySelectorAll("tr")].map(tr=>[...tr.cells].map(c=>digits(c.textContent).replace(/[٬]/g,"")))
  ]);
  const numeric=s=>{
    const value=s.replace(/ تومان$/,"").replace(/[٬]/g,"").replace(/٫/g,".");
    return /^-?\d+(\.\d+)?$/.test(value)?Number(value):s;
  };
  const sheets=sections.map(([title,head,...rows])=>[title[0],head?[head,...rows.map(row=>row.map((cell,i)=>i===0?cell:numeric(cell)))]:[]]);
  download("forushyar-report.xlsx",makeWorkbook(sheets),"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
}
function isValidBackup(d){
  const finite=n=>typeof n==="number"&&Number.isFinite(n);
  const textValue=s=>typeof s==="string";
  const isDate=s=>typeof s==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&Number.isFinite(+new Date(s+"T12:00:00"));
  const inList=(key,list)=>list.includes(key);
  if(d?.version!==1||!d.settings||!textValue(d.settings.name)||!inList(d.settings.theme,["dark","light"]))return false;
  for(const key of ["products","people","docs","tx","checks","shipments","moves","warehouses","cashboxes"]){
    const list=d[key];
    if(!Array.isArray(list)||!list.every(r=>r&&textValue(r.id))||new Set(list.map(r=>r.id)).size!==list.length)return false;
    if(!list.every(r=>r.customFields===undefined || Array.isArray(r.customFields)&&r.customFields.every(f=>f&&textValue(f.name)&&textValue(f.value))))return false;
  }
  const has=(list,k)=>d[list].some(x=>x.id===k);
  return d.cashboxes.length&&d.warehouses.length&&
    d.cashboxes.every(x=>textValue(x.name)&&finite(x.opening))&&d.warehouses.every(x=>textValue(x.name))&&
    d.products.every(x=>textValue(x.name)&&finite(x.price)&&x.price>=0&&finite(x.cost)&&finite(x.opening)&&finite(x.min)&&has("warehouses",x.warehouse))&&
    d.people.every(x=>textValue(x.name)&&inList(x.type,Object.keys(personTypes)))&&
    d.docs.every(x=>Number.isSafeInteger(x.no)&&isDate(x.date)&&finite(x.discount)&&finite(x.paid)&&inList(x.kind,Object.keys(labels).slice(0,5))&&inList(x.status,["posted","draft"])&&has("warehouses",x.warehouse)&&has("cashboxes",x.box)&&Array.isArray(x.lines)&&x.lines.length&&x.lines.every(l=>l&&has("products",l.product)&&finite(l.qty)&&l.qty>0&&finite(l.price)&&finite(l.cost)))&&
    d.tx.every(x=>isDate(x.date)&&finite(x.amount)&&inList(x.kind,Object.keys(labels).slice(5))&&has("cashboxes",x.box))&&
    d.checks.every(x=>isDate(x.due)&&finite(x.amount)&&inList(x.kind,["received","paid"])&&has("cashboxes",x.box))&&
    d.shipments.every(x=>textValue(x.recipient)&&has("docs",x.doc))&&
    d.moves.every(x=>isDate(x.date)&&finite(x.qty)&&x.qty>0&&has("products",x.product)&&(!x.from||has("warehouses",x.from))&&(!x.to||has("warehouses",x.to)));
}
async function restore(file){
  if(!file)return;
  if(file.size>6500000)throw new Error("حجم فایل پشتیبان بیش از ظرفیت این نسخه است.");
  const d=JSON.parse(await file.text());
  if(!isValidBackup(d))throw new Error("فایل پشتیبان فروش‌یار معتبر نیست.");
  modalForm("بازیابی نسخه پشتیبان","<p>داده‌های فعلی با محتوای این فایل جایگزین می‌شوند.</p>",()=>commit(d,"نسخه پشتیبان بازیابی شد."));
}

const code39=Object.fromEntries([...("0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-. $/+%*")].map((c,i)=>[c,[
  0x034,0x121,0x061,0x160,0x031,0x130,0x070,0x025,0x124,0x064,0x109,0x049,0x148,0x019,0x118,0x058,0x00d,0x10c,0x04c,0x01c,0x103,0x043,0x142,0x013,0x112,0x052,0x007,0x106,0x046,0x016,0x181,0x0c1,0x1c0,0x091,0x190,0x0d0,0x085,0x184,0x0c4,0x0a8,0x0a2,0x08a,0x02a,0x094
][i]]));
function drawBarcode(sku){
  let x=10;
  let bars="";
  for(const c of "*"+sku+"*"){
    const bits=code39[c];
    for(let n=0;n<9;n++){
      const w=(bits&(1<<(8-n)))?3:1;
      if(n%2===0)bars+='<rect x="'+x+'" y="0" width="'+w+'" height="44"/>';
      x+=w;
    }
    x++;
  }
  return '<svg role="img" aria-label="بارکد کالا" style="height:54px;width:min(100%,340px);background:white;display:block" viewBox="0 0 '+(x+10)+' 44" fill="#111">'+bars+"</svg>";
}
function labelForm(current){
  const p=get("products",current);

  const valid=/^[0-9A-Z. $/+%\-]{1,30}$/.test(sku);
  const markup='<div class="panel"><h2>'+esc(p.name)+'</h2><p>'+cash(p.price)+'</p>'+(valid?drawBarcode(sku)+"<bdi>"+esc(sku)+"</bdi>":'<p>برای چاپ بارکد Code 39، در ویرایش کالا یک کد معتبر انگلیسی یا عددی وارد کنید.</p>')+'</div>';
  modal("لیبل کالا",markup+'<div class="dialog-foot">'+button("چاپ لیبل",{action:"label-print",id:p.id,symbol:"printer",cls:"btn primary"})+"</div>");
}
let scanStream;
function endScan(){
  scanStream?.getTracks().forEach(t=>t.stop());
  scanStream=null;
  $("#cameraPanel")?.remove();
}
async function scan(mode){
  if(!("BarcodeDetector" in window)||!navigator.mediaDevices?.getUserMedia){toast("این مرورگر اسکن دوربینی را پشتیبانی نمی‌کند. بارکد را دستی یا با بارکدخوان وارد کنید.");return;}
  if($("#cameraPanel")){endScan();return;}
  const form=$("#modalForm");
  const panel=document.createElement("div");
  panel.id="cameraPanel";
  panel.innerHTML='<video playsinline autoplay muted style="max-width:100%;max-height:180px"></video>';
  form.append(panel);
  try{
    const detector=new BarcodeDetector();
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
    if(!panel.isConnected){stream.getTracks().forEach(t=>t.stop());return}
    scanStream=stream;
    const video=$("video",panel);video.srcObject=stream;
    await video.play();
    const tick=async()=>{
      if(scanStream!==stream||!panel.isConnected)return;
      try{
        const result=await detector.detect(video);
        if(scanStream!==stream)return;
        if(result.length){
          const value=result[0].rawValue;
          endScan();
          if(mode==="invoice"){
            try{addInvoiceBarcode(value)}catch(error){notifyError(error)}
          }else form.elements.sku.value=value;
          return;
        }
      }catch{endScan();toast("خواندن بارکد از دوربین ممکن نشد.");return}
      setTimeout(tick,200);
    };
    await tick();
  }catch{endScan();toast("دسترسی به دوربین ممکن نشد.");}
}

function searchResults(q){
  const includes=t=>normalize(t).includes(normalize(q));
  const items=nav.filter(([, ,t])=>includes(t)).map(([v,s,t])=>button(t,{target:v,symbol:s}));
  if(q.trim()){
    items.push(...state.products.filter(p=>includes(p.name+" "+p.sku)).slice(0,5).map(p=>button(p.name,{action:"product",id:p.id,symbol:"box"})));
    items.push(...state.people.filter(p=>includes(p.name+" "+p.phone)).slice(0,5).map(p=>button(p.name,{action:"person-detail",id:p.id,symbol:"people"})));
    items.push(...state.docs.filter(d=>includes(String(d.no))).slice(0,5).map(d=>button("سند "+money(d.no),{action:"doc-detail",id:d.id,symbol:"sale"})));
  }
  $("#searchResults").innerHTML=items.join("")||'<p class="empty">نتیجه‌ای پیدا نشد.</p>';
}
